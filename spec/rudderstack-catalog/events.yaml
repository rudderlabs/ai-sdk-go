# AI events spec v0.4 events for the RudderStack data catalog (rudder-cli, rudder/v1).
version: rudder/v1
kind: events
metadata:
  name: ai_events
spec:
  events:
    - id: ai_user_prompt_created
      name: ai_user_prompt_created
      event_type: track
      description: The user asked something.
    - id: ai_response_received
      name: ai_response_received
      event_type: track
      description: One answer, with totals across every model call, tool and agent it took.
    - id: ai_llm_response_received
      name: ai_llm_response_received
      event_type: track
      description: Optional, one per model call. Totals belong on ai_response_received.
    - id: ai_task_started
      name: ai_task_started
      event_type: track
      description: Since v0.4. Optional, one per background run when it starts, never on a resume. Without an answer, the run is in flight or abandoned.
    - id: ai_interaction_classified
      name: ai_interaction_classified
      event_type: track
      description: Opt-in labels for one answered interaction, from the customer's own classifier.
    - id: ai_interaction_scored
      name: ai_interaction_scored
      event_type: track
      description: Opt-in. One named quality score of an interaction, from an LLM judge, a code check or a human.
    - id: ai_limit_reached
      name: ai_limit_reached
      event_type: track
      description: Sent by the app when a user or account hits a usage limit of the AI feature.
    - id: ai_user_action
      name: ai_user_action
      event_type: track
      description: What the user did with an answer, joined to it by interaction_id.
    - id: mcp_client_seen
      name: mcp_client_seen
      event_type: track
      description: An MCP client's first request in a window, with its name, version, transport and auth.
    - id: mcp_tool_called
      name: mcp_tool_called
      event_type: track
      description: An MCP tools/call request completed or failed. Never tool arguments or results.
    - id: mcp_elicitation_completed
      name: mcp_elicitation_completed
      event_type: track
      description: The MCP server asked the user for input and the client responded or the request failed.
    - id: mcp_capability_requested
      name: mcp_capability_requested
      event_type: track
      description: Opt-in. An agent asked the MCP server for a capability no tool offers.
    - id: mcp_feedback_submitted
      name: mcp_feedback_submitted
      event_type: track
      description: Opt-in. The agent called submit_feedback to report a problem, a missing capability or what worked well. Refused calls send nothing.
    - id: mcp_resource_read
      name: mcp_resource_read
      event_type: track
      description: An MCP resources/read request completed or failed.
    - id: mcp_prompt_used
      name: mcp_prompt_used
      event_type: track
      description: An MCP prompts/get request completed or failed.
    - id: mcp_event_subscription_changed
      name: mcp_event_subscription_changed
      event_type: track
      description: Experimental, opt-in. An MCP Events subscription was created, refreshed or ended.
    - id: mcp_event_delivered
      name: mcp_event_delivered
      event_type: track
      description: Experimental, opt-in. The MCP server finished delivering one MCP Events update.
    - id: declared_tool_event
      name: tool_executed
      event_type: track
      description: Template for a customer-named AI tool event. Replace tool_executed with the configured event name.
    - id: mcp_declared_tool_event
      name: external_tool_executed
      event_type: track
      description: Template for a customer-named MCP tool event. Replace external_tool_executed with the configured event name.
    - id: ai_assistant_opened
      name: ai_assistant_opened
      event_type: track
      description: The user opened the assistant in the web or mobile app.
    - id: ai_assistant_closed
      name: ai_assistant_closed
      event_type: track
      description: The user closed the assistant, with its open duration and close method.
    - id: ai_conversation_started
      name: ai_conversation_started
      event_type: track
      description: The user started a new conversation.
    - id: ai_conversation_switched
      name: ai_conversation_switched
      event_type: track
      description: The user switched to another conversation.
    - id: ai_conversation_renamed
      name: ai_conversation_renamed
      event_type: track
      description: The user renamed a conversation. Never send its title.
    - id: ai_conversation_deleted
      name: ai_conversation_deleted
      event_type: track
      description: The user deleted a conversation.
    - id: ai_conversation_pinned
      name: ai_conversation_pinned
      event_type: track
      description: "Since v0.4. The user pinned a conversation."
    - id: ai_conversation_shared
      name: ai_conversation_shared
      event_type: track
      description: "Since v0.4. The user shared a conversation. Never send the share URL."
    - id: ai_agent_selected
      name: ai_agent_selected
      event_type: track
      description: The user selected the agent, mode or persona that answers next.
    - id: ai_suggestion_shown
      name: ai_suggestion_shown
      event_type: track
      description: Actionable AI output appeared; the denominator of suggestion acceptance rate.
    - id: ai_feedback_requested
      name: ai_feedback_requested
      event_type: track
      description: The app asked for feedback; the denominator of feedback response rate.
