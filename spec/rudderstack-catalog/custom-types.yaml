version: rudder/v1
kind: custom-types
metadata:
  name: ai_events
spec:
  types:
    - id: usage_entry
      name: UsageEntry
      type: object
      description: Reusable usage entry, with unchanged wire keys.
      properties:
        - property: '#property:agent_name'
        - property: '#property:call_purpose'
        - property: '#property:provider'
        - property: '#property:model'
          required: true
        - property: '#property:requested_model'
        - property: '#property:call_count'
          required: true
        - property: '#property:input_tokens'
          required: true
        - property: '#property:output_tokens'
          required: true
        - property: '#property:reasoning_tokens'
        - property: '#property:total_tokens'
          required: true
        - property: '#property:cached_input_tokens'
        - property: '#property:cache_write_tokens'
        - property: '#property:cache_write_1h_tokens'
        - property: '#property:service_tier'
        - property: '#property:server_tool_call_count'
        - property: '#property:server_tool_cost_usd'
        - property: '#property:error_count'
        - property: '#property:cost_usd'
        - property: '#property:credits'
    - id: tool_entry
      name: ToolEntry
      type: object
      description: Reusable tool entry, with unchanged wire keys.
      properties:
        - property: '#property:agent_name'
        - property: '#property:tool_name'
          required: true
        - property: '#property:mcp_server'
        - property: '#property:parent_tool'
        - property: '#property:call_count'
          required: true
        - property: '#property:error_count'
        - property: '#property:error_types'
        - property: '#property:duration_ms'
        - property: '#property:measured_count'
        - property: '#property:max_duration_ms'
    - id: action_details
      name: ActionDetails
      type: object
      description: Reusable action details, with unchanged wire keys.
      properties:
        - property: '#property:feedback_type'
        - property: '#property:feedback_value'
        - property: '#property:feedback_text'
        - property: '#property:feedback_reasons'
        - property: '#property:feedback_scope'
        - property: '#property:items_total'
        - property: '#property:items_accepted'
        - property: '#property:destination'
        - property: '#property:card_kind'
        - property: '#property:target_type'
    - id: tool_error_counts
      name: ToolErrorCounts
      type: object
      description: Counts by fixed tool error category; never exception text.
      properties:
        - property: '#property:rate_limit'
        - property: '#property:timeout'
        - property: '#property:cancelled'
        - property: '#property:denied'
        - property: '#property:auth_error'
        - property: '#property:invalid_request'
        - property: '#property:connection_error'
        - property: '#property:api_error'
    - id: result_content_type
      name: ResultContentType
      type: string
      description: MCP result content kind, never its content.
      config:
        enum:
          - text
          - image
          - audio
          - resource_link
          - resource
          - structured
    - id: attachment_type
      name: AttachmentType
      type: string
      description: Attached media kind, never a file name or content.
      config:
        enum: [image, audio, video, pdf, file]
    - id: gen_ai_message
      name: GenAiMessage
      type: object
      description: Since v0.4 (SDK-6797). OpenTelemetry GenAI message shape; additional message fields are allowed.
      properties:
        - property: '#property:role'
          required: true
        - property: '#property:parts'
          required: true
    - id: gen_ai_message_part
      name: GenAiMessagePart
      type: object
      description: Since v0.4 (SDK-6797). OpenTelemetry GenAI message part. Additional fields carry tool calls, tool results and multimodal content.
      properties:
        - property: '#property:type'
          required: true
        - property: '#property:content'
    - id: gen_ai_tool_call
      name: GenAiToolCall
      type: object
      description: Since v0.4 (SDK-6797). Requested tool call with OpenTelemetry GenAI-compatible naming; additional fields are allowed.
      properties:
        - property: '#property:name'
          required: true
        - property: '#property:arguments'
