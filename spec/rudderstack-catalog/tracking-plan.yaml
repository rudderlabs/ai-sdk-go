# AI events spec v0.4 tracking plan (rudder-cli, rudder/v1). Covers the server v0.4 and client v0.2 schemas.
# Custom properties are allowed, as in the schema. The tracking plan validates events; it does not set
# warehouse column types (see README.md, "Warehouse column types").
# Conditional requirements stay in the schemas. Shared event rules require only fields
# required on both server and client copies; the first client prompt may omit conversation_id.
