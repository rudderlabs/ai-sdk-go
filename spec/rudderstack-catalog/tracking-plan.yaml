        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:action_type'
          required: true
        - property: '#property:action_details'
          properties:
            - property: '#property:feedback_type'
            - property: '#property:feedback_value'
            - property: '#property:feedback_text'
            - property: '#property:feedback_reasons'
            - property: '#property:feedback_scope'
            - property: '#property:items_total'
            - property: '#property:items_accepted'
            - property: '#property:destination'
            - property: '#property:card_kind'
            - property: '#property:target_type'

    - type: event_rule
      id: mcp_client_seen_rule
      event: '#event:mcp_client_seen'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:mcp_session_id'
        - property: '#property:server_name'
          required: true
        - property: '#property:server_version'
        - property: '#property:account_id'
        - property: '#property:client_name'
        - property: '#property:client_title'
        - property: '#property:client_version'
        - property: '#property:client_capabilities'
        - property: '#property:protocol_version'
        - property: '#property:transport'
        - property: '#property:auth_method'
        - property: '#property:oauth_client_id'
        - property: '#property:token_scopes'
        - property: '#property:country'

    - type: event_rule
      id: mcp_tool_called_rule
      event: '#event:mcp_tool_called'
      properties:
        - property: '#property:mcp_session_id'
        - property: '#property:server_name'
        - property: '#property:account_id'
        - property: '#property:client_name'
        - property: '#property:client_version'
        - property: '#property:protocol_version'
        - property: '#property:interaction_id'
        - property: '#property:sample_rate'
        - property: '#property:trace_id'
        - property: '#property:request_id'
          required: true
        - property: '#property:tool_name'
          required: true
        - property: '#property:tool_status'
          required: true
        - property: '#property:error_type'
        - property: '#property:is_error_result'
        - property: '#property:duration_ms'
        - property: '#property:time_to_cancel_ms'
        - property: '#property:argument_keys'
        - property: '#property:invalid_arguments'
        - property: '#property:retry_count'
        - property: '#property:call_index'
        - property: '#property:ms_since_previous_call'
        - property: '#property:progress_requested'
        - property: '#property:result_size_bytes'
        - property: '#property:result_tokens_estimate'
        - property: '#property:result_content_types'
        - property: '#property:result_paginated'
        - property: '#property:intent'
        - property: '#property:user_sentiment'
        - property: '#property:call_reason'

    - type: event_rule
      id: mcp_elicitation_completed_rule
      event: '#event:mcp_elicitation_completed'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:mcp_session_id'
        - property: '#property:server_name'
        - property: '#property:account_id'
        - property: '#property:interaction_id'
        - property: '#property:trace_id'
        - property: '#property:elicitation_action'
          required: true
        - property: '#property:tool_name'
        - property: '#property:request_id'
        - property: '#property:duration_ms'
        - property: '#property:error_type'

    - type: event_rule
      id: mcp_capability_requested_rule
      event: '#event:mcp_capability_requested'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:mcp_session_id'
        - property: '#property:server_name'
        - property: '#property:account_id'
        - property: '#property:client_name'
        - property: '#property:interaction_id'
        - property: '#property:trace_id'
        - property: '#property:capability'
          required: true
