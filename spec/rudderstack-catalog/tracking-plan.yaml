# AI events spec v0.4 tracking plan (rudder-cli, rudder/v1). Mirrors spec/ai-events-v0.3.schema.json.
# Custom properties are allowed, as in the schema. The tracking plan validates events; it does not set
# warehouse column types (see the README's "Warehouse column types").
# Conditional rules stay in the schema only: conversation_id is optional on a client copy of
# ai_user_prompt_created, and ai_interaction_scored needs score_value or score_label.
version: rudder/v1
kind: tracking-plan
metadata:
  name: ai_events
spec:
  id: ai_events_v0_3
  display_name: AI events v0.4
  description: Events from the RudderStack AI SDKs (@rudderstack/ai, rudderstack-ai), spec v0.4.
  rules:
    - type: event_rule
      id: ai_user_prompt_created_rule
      event: '#event:ai_user_prompt_created'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:source'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:trigger_source'
        - property: '#property:trigger_event_id'
        - property: '#property:task_name'
        - property: '#property:parent_interaction_id'
        - property: '#property:agent_version'
        - property: '#property:variant'
        - property: '#property:input_method'
        - property: '#property:attachment_count'
        - property: '#property:attachment_types'
        - property: '#property:intent'
        - property: '#property:prompt_text'
        - property: '#property:prompt_source'
        - property: '#property:suggestion_id'
        - property: '#property:prompt_length'
        - property: '#property:agent_name'
        - property: '#property:mode'
        - property: '#property:context_item_count'
        - property: '#property:context_item_types'

    - type: event_rule
      id: ai_response_received_rule
      event: '#event:ai_response_received'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:source'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:trigger_source'
        - property: '#property:trigger_event_id'
        - property: '#property:task_name'
        - property: '#property:parent_interaction_id'
        - property: '#property:agent_version'
        - property: '#property:variant'
        - property: '#property:response_status'
          required: true
        - property: '#property:pause_reason'
        - property: '#property:end_reason'
        - property: '#property:block_reason'
        - property: '#property:pause_count'
        - property: '#property:total_paused_ms'
        - property: '#property:trigger'
        - property: '#property:client_disconnected'
        - property: '#property:primary_model'
        - property: '#property:primary_provider'
        - property: '#property:latency_ms'
        - property: '#property:time_to_first_token_ms'
        - property: '#property:llm_call_count'
        - property: '#property:tool_call_count'
        - property: '#property:total_input_tokens'
        - property: '#property:total_output_tokens'
        - property: '#property:total_reasoning_tokens'
        - property: '#property:total_tokens'
        - property: '#property:total_cached_input_tokens'
        - property: '#property:total_cache_write_tokens'
        - property: '#property:total_cost_usd'
        - property: '#property:total_credits'
        - property: '#property:compaction_count'
        - property: '#property:finish_reason'
        - property: '#property:error_type'
        - property: '#property:intent'
        - property: '#property:outcome'
        - property: '#property:confidence'
        - property: '#property:response_text'
        - property: '#property:trace_id'
        - property: '#property:client_error_kind'
        - property: '#property:time_to_first_render_ms'
        - property: '#property:usage_breakdown'
          properties:
            - property: '#property:agent_name'
            - property: '#property:call_purpose'
            - property: '#property:provider'
            - property: '#property:model'
              required: true
            - property: '#property:requested_model'
            - property: '#property:call_count'
              required: true
            - property: '#property:input_tokens'
              required: true
            - property: '#property:output_tokens'
              required: true
            - property: '#property:reasoning_tokens'
            - property: '#property:total_tokens'
              required: true
            - property: '#property:cached_input_tokens'
            - property: '#property:cache_write_tokens'
            - property: '#property:cache_write_1h_tokens'
            - property: '#property:service_tier'
            - property: '#property:server_tool_call_count'
            - property: '#property:server_tool_cost_usd'
            - property: '#property:error_count'
            - property: '#property:cost_usd'
            - property: '#property:credits'
        - property: '#property:tool_breakdown'
          properties:
            - property: '#property:agent_name'
            - property: '#property:tool_name'
              required: true
            - property: '#property:mcp_server'
            - property: '#property:parent_tool'
            - property: '#property:call_count'
              required: true
            - property: '#property:error_count'
            - property: '#property:error_types'
            - property: '#property:duration_ms'
            - property: '#property:measured_count'
            - property: '#property:max_duration_ms'

    - type: event_rule
      id: ai_task_started_rule
      event: '#event:ai_task_started'
      properties:
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
        - property: '#property:task_name'
          required: true
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:trigger_source'
        - property: '#property:trigger_event_id'
        - property: '#property:parent_interaction_id'

    - type: event_rule
      id: ai_llm_response_received_rule
      event: '#event:ai_llm_response_received'
      properties:
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
        - property: '#property:sample_rate'
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:trigger_source'
        - property: '#property:trigger_event_id'
        - property: '#property:task_name'
        - property: '#property:parent_interaction_id'
        - property: '#property:agent_version'
        - property: '#property:variant'
        - property: '#property:agent_name'
        - property: '#property:provider'
        - property: '#property:model'
          required: true
        - property: '#property:requested_model'
        - property: '#property:input_tokens'
          required: true
        - property: '#property:output_tokens'
          required: true
        - property: '#property:reasoning_tokens'
        - property: '#property:total_tokens'
        - property: '#property:cached_input_tokens'
        - property: '#property:cache_write_tokens'
        - property: '#property:cache_write_1h_tokens'
        - property: '#property:service_tier'
        - property: '#property:server_tool_call_count'
        - property: '#property:server_tool_cost_usd'
        - property: '#property:cost_usd'
        - property: '#property:credits'
        - property: '#property:latency_ms'
        - property: '#property:time_to_first_token_ms'
        - property: '#property:call_purpose'
        - property: '#property:fallback_used'
        - property: '#property:byok'
        - property: '#property:response_id'
        - property: '#property:finish_reason'
        - property: '#property:error_type'

    - type: event_rule
      id: ai_interaction_classified_rule
      event: '#event:ai_interaction_classified'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:trigger_source'
        - property: '#property:trigger_event_id'
        - property: '#property:task_name'
        - property: '#property:parent_interaction_id'
        - property: '#property:agent_version'
        - property: '#property:variant'
        - property: '#property:trigger'
        - property: '#property:intent'
          required: true
        - property: '#property:outcome'
          required: true
        - property: '#property:intent_summary'
        - property: '#property:classifier'
          required: true
        - property: '#property:classifier_model'
        - property: '#property:classifier_duration_ms'
        - property: '#property:classifier_cost_usd'

    - type: event_rule
      id: ai_interaction_scored_rule
      event: '#event:ai_interaction_scored'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:trigger_source'
        - property: '#property:trigger_event_id'
        - property: '#property:task_name'
        - property: '#property:parent_interaction_id'
        - property: '#property:agent_version'
        - property: '#property:variant'
        - property: '#property:trigger'
        - property: '#property:evaluation_name'
          required: true
        - property: '#property:score_value'
        - property: '#property:score_label'
        - property: '#property:evaluator'
          required: true
        - property: '#property:sampled'
        - property: '#property:explanation'

    - type: event_rule
      id: ai_limit_reached_rule
      event: '#event:ai_limit_reached'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:conversation_id'
        - property: '#property:interaction_id'
        - property: '#property:feature'
        - property: '#property:surface'
        - property: '#property:account_id'
        - property: '#property:on_behalf_of'
        - property: '#property:agent_version'
        - property: '#property:variant'
        - property: '#property:limit_type'
          required: true

    - type: event_rule
      id: ai_user_action_rule
      event: '#event:ai_user_action'
      properties:
        - property: '#property:sample_rate'
        - property: '#property:conversation_id'
          required: true
        - property: '#property:interaction_id'
          required: true
