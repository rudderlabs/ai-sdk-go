        - property: '#property:account_id'
        - property: '#property:client_name'
        - property: '#property:client_version'
        - property: '#property:protocol_version'
        - property: '#property:interaction_id'
        - property: '#property:trace_id'
        - property: '#property:request_id'
          required: true
        - property: '#property:prompt_name'
          required: true
        - property: '#property:tool_status'
          required: true
