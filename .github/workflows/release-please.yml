name: Release Please

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # A short-lived GitHub App token instead of GITHUB_TOKEN, so the release PR gets CI checks.
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Keeps a release PR with the conventional commits since the last release.
      # Merging it bumps version.go, updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub release.
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
