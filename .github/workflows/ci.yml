name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match GOLANGCI_LINT_VERSION and GOVULNCHECK_VERSION in the Makefile.
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0
  MIN_COVERAGE: 90
  # Every module of go.work (./... alone covers only the root module). Keep in sync with the Makefile.
  PKGS: ./... ./rudderopenai/... ./rudderanthropic/... ./ruddergenai/... ./rudderbedrock/... ./rudderotel/... ./internal/conformance/... ./examples/...

jobs:
  lint:
    name: Format, vet and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet $PKGS

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ${{ env.PKGS }}

  test:
    name: Unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The minimum in go.mod and the supported Go releases.
        go: ['1.26.x', '1.27.x']
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run unit tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic $PKGS

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
          printf '### Coverage\n| Metric | Covered |\n| --- | --- |\n| statements | %s%% |\n' "$total" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${total}% (minimum ${MIN_COVERAGE}%)"
          awk -v t="$total" -v min="$MIN_COVERAGE" 'BEGIN { exit !(t >= min) }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go${{ matrix.go }}
          path: coverage.out
          retention-days: 14

  mcpgo-latest:
    name: mcp-go v1.1.1 (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # -modfile needs module mode.
    env:
      GOWORK: 'off'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # go.mod requires the oldest supported mcp-go (v0.55.1), so consumers keep their version;
      # this job tests the latest, which also serves 2026-07-28.
      - name: Test ruddermcpgo and its example against mcp-go v1.1.1
        run: |
          cp go.mod go.latest.mod
          cp go.sum go.latest.sum
          go get -modfile=go.latest.mod github.com/mark3labs/mcp-go@v1.1.1
          go test -race -tags mcpgo_v1 -modfile=go.latest.mod ./ruddermcpgo/...

      # The examples are their own module.
      - name: Test the mcp-go example against mcp-go v1.1.1
        working-directory: examples
        run: |
          cp go.mod go.latest.mod
          cp go.sum go.latest.sum
          go get -modfile=go.latest.mod github.com/mark3labs/mcp-go@v1.1.1
          go test -race -tags mcpgo_v1 -modfile=go.latest.mod ./mcp-server-mcpgo/...

  module:
    name: Module ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [., rudderopenai, rudderanthropic, ruddergenai, rudderbedrock, rudderotel, internal/conformance, examples]
    # Each module as users build it: its own go.mod, no workspace.
    env:
      GOWORK: 'off'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      # Without the workspace, each module resolves the lowest versions its go.mod supports (for
      # example openai-go v3.70.0, mcp-go v0.55.1); the unit-test job covers the latest the
      # examples module pins.
      - name: Test against the go.mod minimums
        if: matrix.module != 'examples'
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  vulncheck:
    name: Vulnerability scan ${{ matrix.module.dir }} (Go ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, stable]
        module:
          - dir: '.'
            go-version-file: go.mod
          - dir: rudderopenai
            go-version-file: rudderopenai/go.mod
          - dir: rudderanthropic
            go-version-file: rudderanthropic/go.mod
          - dir: ruddergenai
            go-version-file: ruddergenai/go.mod
          - dir: rudderbedrock
            go-version-file: rudderbedrock/go.mod
          - dir: rudderotel
            go-version-file: rudderotel/go.mod
          - dir: internal/conformance
            go-version-file: internal/conformance/go.mod
          - dir: examples
            go-version-file: examples/go.mod
    # Each module as users build it: its own go.mod, no workspace.
    env:
      GOWORK: 'off'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup minimum Go version
        if: matrix.toolchain == 'minimum'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module['go-version-file'] }}

      - name: Setup stable Go version
        if: matrix.toolchain == 'stable'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: govulncheck
        working-directory: ${{ matrix.module.dir }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  example:
    name: Example ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [mcp-server, mcp-server-mcpgo, mcp-stateless-http, mcp-auth, openai, anthropic, google-genai, bedrock-converse, background-agent, manual]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # Against a mock data plane; --check exits non-zero on a missing or wrong event.
      - name: Run the example against a mock data plane
        env:
          EXAMPLE: ${{ matrix.example }}
        run: go run "./examples/${EXAMPLE}" --check
