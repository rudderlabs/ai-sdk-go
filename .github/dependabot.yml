version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'github_actions'
    open-pull-requests-limit: 2
    groups:
      github-actions-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
      github-actions-version:
        applies-to: 'version-updates'
        patterns:
          - '*'

  # The library modules. Their MCP and provider SDK requirements are tested minimums, raised
  # deliberately (CONTRIBUTING.md), so Dependabot leaves them alone.
  - package-ecosystem: 'gomod'
    directories:
      - '/'
      - '/rudderopenai'
      - '/rudderanthropic'
      - '/ruddergenai'
      - '/rudderbedrock'
      - '/rudderotel'
    ignore:
      - dependency-name: 'github.com/mark3labs/mcp-go'
      - dependency-name: 'github.com/modelcontextprotocol/go-sdk'
      - dependency-name: 'github.com/openai/openai-go/*'
      - dependency-name: 'github.com/anthropics/anthropic-sdk-go'
      - dependency-name: 'google.golang.org/genai'
      - dependency-name: 'github.com/aws/*'
      - dependency-name: 'go.opentelemetry.io/otel/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      gomod-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
      gomod-non-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      gomod-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'major'

  # The rest of go.work: the conformance runner and the examples track the latest SDKs.
  - package-ecosystem: 'gomod'
    directories:
      - '/internal/conformance'
      - '/examples'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      gomod-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
      gomod-non-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      gomod-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'major'
