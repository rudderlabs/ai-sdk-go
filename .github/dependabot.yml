version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'github_actions'
    open-pull-requests-limit: 2
    groups:
      github-actions-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
      github-actions-version:
        applies-to: 'version-updates'
        patterns:
          - '*'

  # Every module of go.work.
  - package-ecosystem: 'gomod'
    directories:
      - '/'
      - '/rudderopenai'
      - '/rudderanthropic'
      - '/ruddergenai'
      - '/rudderbedrock'
      - '/rudderotel'
      - '/internal/conformance'
      - '/examples'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      gomod-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
      gomod-non-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      gomod-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'major'
